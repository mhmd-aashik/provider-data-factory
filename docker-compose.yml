services:
  mongodb:
    image: mongo:7
    container_name: provider-mongodb
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: provider-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      MONGO_RAW_URI: mongodb://mongodb:27017/provider_raw
      MONGO_TARGET_URI: mongodb://mongodb:27017/provider_normalized
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      INGESTION_BATCH_SIZE: '50'
    depends_on:
      - mongodb
      - redis

volumes:
  mongodb_data:
  redis_data:
